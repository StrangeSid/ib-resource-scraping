<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>IB Index — past papers, markschemes, question banks</title>
<style>
  :root {
    --paper: #fafaf7;
    --ink: #1a1b1e;
    --faint: #6b6f76;
    --rule: #e2e0d8;
    --green: #1e4d3b;
    --amber: #8a5e14;
    --blue: #274268;
  }
  * { box-sizing: border-box; }
  body {
    background: var(--paper);
    color: var(--ink);
    font: 16px/1.55 -apple-system, "Segoe UI", sans-serif;
    margin: 0;
  }
  .wrap { max-width: 880px; margin: 0 auto; padding: 48px 24px 80px; text-align: left; }
  h1 {
    font-family: Georgia, "Times New Roman", serif;
    font-weight: 700;
    font-size: clamp(2rem, 5vw, 3rem);
    letter-spacing: -0.01em;
    margin: 0 0 4px;
  }
  .sub { color: var(--faint); margin: 0 0 28px; max-width: 60ch; }
  .sub b { color: var(--ink); font-weight: 600; }
  form { display: flex; gap: 8px; margin-bottom: 12px; }
  input[type="search"] {
    flex: 1;
    font: inherit;
    padding: 12px 14px;
    border: 2px solid var(--ink);
    border-radius: 3px;
    background: #fff;
  }
  input[type="search"]:focus-visible, button:focus-visible, a:focus-visible {
    outline: 3px solid var(--green);
    outline-offset: 2px;
  }
  button {
    font: inherit;
    font-weight: 600;
    padding: 12px 22px;
    background: var(--green);
    color: #fff;
    border: 2px solid var(--green);
    border-radius: 3px;
    cursor: pointer;
  }
  .kinds { display: flex; gap: 16px; margin: 0 0 24px; color: var(--faint); font-size: 0.95rem; }
  .kinds label { display: flex; gap: 6px; align-items: center; cursor: pointer; }
  #meta { color: var(--faint); font-size: 0.95rem; margin: 0 0 8px; min-height: 1.5em; }
  ol#results { list-style: none; margin: 0; padding: 0; border-top: 2px solid var(--ink); }
  ol#results li {
    padding: 12px 4px;
    border-bottom: 1px solid var(--rule);
    display: grid;
    grid-template-columns: 1fr auto;
    gap: 2px 12px;
  }
  .t { font-weight: 600; overflow-wrap: anywhere; }
  .t a { color: inherit; text-decoration: none; }
  .t a:hover { text-decoration: underline; }
  .s { color: var(--faint); font-size: 0.9rem; grid-column: 1; }
  .stamp {
    grid-row: 1 / span 2;
    align-self: center;
    font-size: 0.8rem;
    font-weight: 700;
    border: 1.5px solid currentColor;
    border-radius: 3px;
    padding: 2px 8px;
    transform: rotate(-1.5deg);
    white-space: nowrap;
  }
  .stamp.file { color: var(--green); }
  .stamp.remote { color: var(--blue); }
  .stamp.link { color: var(--amber); }
  #pager { display: flex; gap: 8px; margin: 16px 0 0; }
  #pager button {
    background: #fff;
    color: var(--ink);
    border: 2px solid var(--ink);
    font-weight: 600;
  }
  .dl { font-size: 0.9rem; margin-left: 8px; }
  .dl { font-size: 0.9rem; }
  footer { margin-top: 40px; color: var(--faint); font-size: 0.9rem; border-top: 1px solid var(--rule); padding-top: 12px; }
  @media (max-width: 560px) {
    form { flex-direction: column; }
    button { width: 100%; }
  }
  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; }
  }
</style>
</head>
<body>
<div class="wrap">
  <h1>IB Index</h1>
  <p class="sub" id="statsline">Past papers, markschemes, grade boundaries and question banks, gathered into one searchable shelf.</p>
  <form id="f" role="search">
    <input id="q" type="search" name="q" placeholder="e.g. physics paper 2 TZ1 markscheme" aria-label="Search the index" autocomplete="off">
    <button type="submit">Search</button>
  </form>
  <div class="kinds" role="radiogroup" aria-label="Result kind">
    <label><input type="radio" name="kind" value="" checked>Everything</label>
    <label><input type="radio" name="kind" value="file">Downloaded</label>
    <label><input type="radio" name="kind" value="remote">Catalog only</label>
    <label><input type="radio" name="kind" value="link">Link graph</label>
    <label>Sort
      <select id="sort" aria-label="Sort order">
        <option value="rank">Most relevant</option>
        <option value="recent">Newest first</option>
      </select>
    </label>
  </div>
  <div class="kinds" id="filters" style="display:none" aria-label="Filters">
    <label>Type <select id="f_rtype" aria-label="Resource type"></select></label>
    <label>Level <select id="f_level" aria-label="Level"></select></label>
    <label>Session <select id="f_sess" aria-label="Session"></select></label>
  </div>
  <p id="meta" aria-live="polite">Type two or more characters to search the index.</p>
  <ol id="results"></ol>
  <p id="pager" style="display:none">
    <button id="prev" type="button">← Newer</button>
    <button id="next" type="button">Older →</button>
  </p>
  <footer id="foot"></footer>
</div>
<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

async function stats() {
  try {
    const r = await (await fetch("/stats")).json();
    const d = r.data;
    $("statsline").innerHTML = `Past papers, markschemes, grade boundaries and question banks — <b>${d.indexed.toLocaleString()}</b> records on one searchable shelf.`;
    $("foot").textContent = `${d.files} files stored locally · ${d.remote_catalog} cataloged elsewhere · ${d.links} curated links.`;
  } catch { /* offline stats stay static */ }
}

async function run(offset = 0) {
  const q = $("q").value.trim();
  if (q.length < 2) {
    $("meta").textContent = "Type two or more characters to search the index.";
    $("results").innerHTML = "";
    return;
  }
  const kind = document.querySelector('input[name="kind"]:checked').value;
  const sort = $("sort").value;
  const f = (id) => $(id).value;
  let url = `/search?q=${encodeURIComponent(q)}&limit=30&offset=${offset}&sort=${sort}` + (kind ? `&kind=${kind}` : "");
  for (const [id, p] of [["f_rtype", "rtype"], ["f_level", "level"], ["f_sess", "session"]]) {
    if (f(id)) url += `&${p}=${encodeURIComponent(f(id))}`;
  }
  let res;
  try {
    res = await (await fetch(url)).json();
  } catch {
    $("meta").textContent = "The index did not answer. Is the API running?";
    return;
  }
  const rows = res.data;
  const more = rows.length === 30;
  $("pager").style.display = rows.length ? "flex" : "none";
  $("prev").disabled = offset === 0;
  $("next").disabled = !more;
  window._off = offset;
  $("meta").textContent = rows.length
    ? `${rows.length} result${rows.length > 1 ? "s" : ""} for “${q}”${offset ? ` (from ${offset + 1})` : ""}`
    : `Nothing filed under “${q}”. Try fewer or different words.`;
  $("results").innerHTML = rows.map((r) => {
    const link = `<a href="${esc(r.url)}" target="_blank" rel="noopener">${esc(r.title)}</a>`;
    const dl = r.kind === "file" && r.extra
      ? `<a class="dl" href="/download/${esc(r.extra)}">save a local copy</a>` : "";
    const when = r.ts ? ` · ${esc(r.ts.slice(0, 7))}` : "";
    return `<li><span class="t">${link}${dl}</span><span class="stamp ${esc(r.kind)}">${esc(r.kind)}</span>` +
      `<span class="s">${r.rtype && r.rtype !== "other" ? esc(r.rtype) + " · " : ""}${esc(r.source)}${r.subject ? " · " + esc(r.subject.split(" ").slice(0, 4).join(" ")) : ""}${when}</span></li>`;
  }).join("");
  facets();
}

$("prev").addEventListener("click", () => run(Math.max(0, (window._off || 0) - 30)));
$("next").addEventListener("click", () => run((window._off || 0) + 30));

$("f").addEventListener("submit", (e) => { e.preventDefault(); run(0); });
document.querySelectorAll('input[name="kind"]').forEach((el) =>
  el.addEventListener("change", () => run(0)));
$("sort").addEventListener("change", () => run(0));
for (const id of ["f_rtype", "f_level", "f_sess"]) {
  $(id).addEventListener("change", () => run(0));
}

async function facets() {
  const q = $("q").value.trim();
  const kind = document.querySelector('input[name="kind"]:checked').value;
  let url = "/facets?" + (q.length >= 2 ? `q=${encodeURIComponent(q)}&` : "") + (kind ? `kind=${kind}` : "");
  let d;
  try {
    d = (await (await fetch(url)).json()).data;
  } catch { return; }
  const map = [["f_rtype", "rtype"], ["f_level", "level"], ["f_sess", "sess"]];
  let any = false;
  for (const [id, key] of map) {
    const cur = $(id).value;
    const opts = (d[key] || []).slice(0, 12);
    $(id).innerHTML = `<option value="">All</option>` + opts.map((o) =>
      `<option value="${esc(o.value)}">${esc(o.value)} (${o.count})</option>`).join("");
    if ([...$(id).options].some((o) => o.value === cur)) $(id).value = cur;
    if (opts.length) any = true;
  }
  $("filters").style.display = any ? "flex" : "none";
}
let t;
$("q").addEventListener("input", () => { clearTimeout(t); t = setTimeout(() => run(0), 350); });
stats();
</script>
</body>
</html>
